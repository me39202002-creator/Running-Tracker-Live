<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跑步夥伴 GPS 即時定位系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: 100vh; width: 100%; }
        .gm-ui-hover-effect { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 m-0 p-0 overflow-hidden font-sans relative">

    <!-- 地圖容器 -->
    <div id="map"></div>

    <!-- 右下角：分享位置資訊按鈕 -->
    <button id="openShareBtn" class="absolute bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transition duration-200 flex items-center space-x-2 z-10">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z" />
        </svg>
        <span>分享位置資訊</span>
    </button>

    <!-- 分享設定彈出視窗 (預設隱藏) -->
    <div id="shareModal" class="hidden absolute inset-0 bg-black bg-opacity-50 z-20 flex items-center justify-center">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-80">
            <h2 class="text-xl font-bold text-gray-800 mb-4">分享你的即時位置</h2>
            
            <label class="block text-sm font-medium text-gray-700 mb-1">選擇分享時間</label>
            <select id="shareDuration" class="w-full border-gray-300 border rounded-lg p-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="60">1 小時</option>
                <option value="120">2 小時</option>
                <option value="0">直到我手動關閉</option>
            </select>

            <label class="block text-sm font-medium text-gray-700 mb-1">專屬邀請連結</label>
            <div class="flex mb-4">
                <input type="text" id="shareLinkInput" readonly class="w-full border-gray-300 border rounded-l-lg p-2 text-sm bg-gray-50 focus:outline-none">
                <button id="copyLinkBtn" class="bg-blue-100 hover:bg-blue-200 text-blue-700 px-3 rounded-r-lg text-sm font-semibold transition">
                    複製
                </button>
            </div>

            <div class="flex justify-end space-x-3 mt-6">
                <button id="closeShareBtn" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">取消</button>
                <button id="startShareBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition font-semibold">開始分享</button>
            </div>
        </div>
    </div>

    <!-- 停止分享浮動提示 (預設隱藏) -->
    <div id="activeShareBadge" class="hidden absolute top-4 left-1/2 transform -translate-x-1/2 bg-white px-4 py-2 rounded-full shadow border border-red-200 flex items-center space-x-3 z-10">
        <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
        <span class="text-sm font-medium text-gray-700">正在分享位置</span>
        <button id="stopShareBtn" class="text-xs text-red-600 hover:text-red-800 font-bold ml-2">停止</button>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
